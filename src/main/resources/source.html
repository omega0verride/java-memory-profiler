<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Class Source — Java Memory Profiler</title>
<link rel="stylesheet" href="/web/styles.css">
<style>
  body { overflow: auto; }
  .source-page {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 28px;
  }
  .source-page header {
    background: none;
    border-bottom: 1px solid var(--grid);
    padding: 0 0 12px;
    margin-bottom: 20px;
    min-height: unset;
  }
  .source-page header h1 { font-size: 15px; }
  .source-page header .sub { color: var(--mute); font-size: 12px; font-weight: normal; }

  .source-search-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .source-search-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--grid);
    border-radius: 4px;
    padding: 8px 12px;
    font-size: 13px;
    color: var(--fg);
    font-family: Consolas, Menlo, monospace;
    outline: none;
  }
  .source-search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(78, 161, 255, 0.15);
  }
  .source-search-input::placeholder { color: var(--mute-2); }
  .source-go-btn {
    padding: 8px 14px;
    font-size: 13px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 500;
  }
  .source-go-btn:hover { opacity: 0.9; }
  .source-go-btn:disabled { opacity: 0.4; cursor: default; }

  .source-meta {
    display: flex;
    gap: 16px;
    align-items: center;
    margin-bottom: 12px;
    font-size: 12px;
  }
  .source-meta .class-name {
    font-family: Consolas, Menlo, monospace;
    font-weight: 600;
    color: var(--fg);
  }
  .source-meta .origin-badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 8px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .source-meta .origin-badge.decompiled {
    background: rgba(255, 176, 32, 0.15);
    color: #ffb020;
    border: 1px solid rgba(255, 176, 32, 0.3);
  }
  .source-meta .origin-badge.source {
    background: rgba(55, 194, 106, 0.15);
    color: #37c26a;
    border: 1px solid rgba(55, 194, 106, 0.3);
  }

  .source-code-wrap {
    border: 1px solid var(--grid);
    border-radius: 4px;
    overflow: auto;
    max-height: calc(100vh - 200px);
    background: var(--bg);
  }
  .source-code {
    margin: 0;
    padding: 12px 0;
    width: max-content;
    min-width: 100%;
    font-size: 12px;
    line-height: 1.6;
    font-family: Consolas, Menlo, monospace;
    color: var(--fg);
    white-space: pre;
    tab-size: 4;
  }
  .source-code .line-num {
    display: inline-block;
    width: 40px;
    text-align: right;
    padding-right: 12px;
    color: var(--mute-2);
    user-select: none;
    border-right: 1px solid var(--grid);
    margin-right: 12px;
  }
  .source-code > span { display: block; padding: 0 16px; }
  .source-code .line-highlight {
    background: var(--accent-soft);
    box-shadow: inset 3px 0 0 var(--mark);
  }
  .source-code .line-highlight .line-num { color: var(--mark); font-weight: 600; }
  .source-meta .source-file {
    font-family: Consolas, Menlo, monospace;
    color: var(--mute);
  }
  .source-meta .line-chip {
    font-family: Consolas, Menlo, monospace;
    color: var(--mark);
    text-decoration: none;
    padding: 1px 8px;
    border-radius: 8px;
    border: 1px solid var(--grid-2);
  }
  .source-meta .line-chip:hover { background: var(--hover-bg); }
  .source-meta .line-note { color: var(--mute); }

  .source-error {
    background: rgba(255, 110, 110, 0.1);
    border: 1px solid rgba(255, 110, 110, 0.3);
    color: var(--end);
    font-size: 12px;
    padding: 8px 10px;
    border-radius: 4px;
    margin-bottom: 12px;
    font-family: Consolas, Menlo, monospace;
    white-space: pre-wrap;
  }
  .source-loading {
    color: var(--mute);
    font-size: 12px;
    padding: 20px;
    text-align: center;
  }
</style>
<script type="importmap">
{
  "imports": {
    "vue": "https://unpkg.com/vue@3.4.38/dist/vue.esm-browser.prod.js"
  }
}
</script>
</head>
<body>
<div id="app" class="source-page">
  <header>
    <h1>Class Source <span class="sub">— Java Memory Profiler</span></h1>
    <span class="spacer"></span>
    <a class="hdr-gh" href="https://github.com/omega0verride/java-memory-profiler" target="_blank" rel="noopener" title="omega0verride/java-memory-profiler on GitHub">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
      <span class="hdr-gh-name">omega0verride/java-memory-profiler</span>
    </a>
  </header>

  <div class="source-search-row">
    <input
      class="source-search-input"
      v-model="className"
      placeholder="Fully qualified class name (e.g. java.util.HashMap)"
      spellcheck="false"
      @keydown.enter.prevent="loadSource"
    >
    <button class="source-go-btn" @click="loadSource" :disabled="loading || !className.trim()">
      {{ loading ? 'Loading...' : 'View Source' }}
    </button>
  </div>

  <div v-if="error" class="source-error">{{ error }}</div>

  <div v-if="result">
    <div class="source-meta">
      <span class="class-name">{{ result.className }}</span>
      <span class="origin-badge" :class="result.origin">{{ result.origin }}</span>
      <span v-if="result.file" class="source-file" :title="'Found under the configured sourceRoots or on the classpath'">{{ result.file }}</span>
      <a v-if="highlightLine" href="#" class="line-chip" title="Scroll to the highlighted line" @click.prevent="scrollToHighlight">{{ lineNote }}</a>
      <span v-else-if="lineNote" class="line-note">{{ lineNote }}</span>
    </div>
    <div class="source-code-wrap">
      <pre class="source-code"><span v-for="(line, i) in lines" :key="i" :class="{ 'line-highlight': highlightLine === i + 1 }"><span class="line-num">{{ i + 1 }}</span>{{ line }}
</span></pre>
    </div>
  </div>

  <div v-if="loading" class="source-loading">Decompiling...</div>
</div>
<script type="module" src="/web/source-app.js"></script>
</body>
</html>
